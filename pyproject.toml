[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Open-source defense framework against AI Agent Traps (DeepMind 2026)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["ai-security", "agent-security", "prompt-injection", "ai-safety", "steganography"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pypdf>=3.15.0",
    "openpyxl>=3.1.0",
    "icalendar>=5.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "click>=8.1.0",
    "flask>=3.0.0",
    "anthropic>=0.25.0",
    "colorama>=0.4.6",
    "rich>=13.0.0",
    "cssutils>=2.7.0",
]

[project.scripts]
agentguard = "cli.main:cli"

[project.urls]
Homepage = "https://github.com/agentguard/agentguard"
Issues = "https://github.com/agentguard/agentguard/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
